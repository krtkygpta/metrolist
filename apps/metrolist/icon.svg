<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <circle cx="48" cy="48" r="48" fill="#000000"/>
  <!-- A faint rim so the black circle still reads as a tile on the dark app list. -->
